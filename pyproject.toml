[project]
name = "resume"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepmerge>=3.0",
    "dynaconf>=3.2.12",
    "etabli",
    "funcy>=2.0",
    "invoke>=2.2.1",
    "jinja2>=3.1.6",
    "livereload>=2.7.1",
    "loguru>=0.7.3",
    "markdown>=3.10",
    "rich>=14.2.0",
    "watchdog>=6.0.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume"]

[tool.uv.sources]
etabli = { git = "https://github.com/antoine-gallix/etabli.git" }

[dependency-groups]
dev = [
    "black>=26.5.1",
]
